
[project]
authors = [
  {name = "Sylvie Dagoret-Campagne", email = "sylvie.dagoret-campagne@ijclab.in2p3.fr"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
]
dependencies = [
  "numpy>=1.20.0",
  "pyarrow",
  "pandas>=1.3.0",
  "polars",
  "astropy>=5.0",
  "scikit-learn>=0.24.0", # NOUVEAU: Pour la classification
  "matplotlib>=3.4.0", # NOUVEAU: Pour le traçage
  "scipy>=1.7.0", # NOUVEAU: Pour curve_fit
]
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
name = "transcientslightcurves"
readme = "README.md"
requires-python = ">=3.9"

[project.urls]
"Documentation" = "https://github.com/LSSTDESC/transcientslightcurves#readme"
"Source Code" = "https://github.com/LSSTDESC/transcientslightcurves"

[project.scripts]
# Optionnel: Ajouter des scripts CLI si nécessaire
# fit_sn = "transcientslightcurves.cli:main"

[project.optional-dependencies]
dev = [
  "asv==0.6.4",
  "virtualenv==20.30",
  "jupyter",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "ruff",
  "pytest-doctest",
]

[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=62", # Used to build and package the Python project
  "setuptools_scm>=6.2", # Gets release version from git. Makes it available programmatically
]

[tool.setuptools_scm]
write_to = "src/transcientslightcurves/_version.py"

[tool.pytest.ini_options]
addopts = "--doctest-modules --doctest-glob=*.rst"
testpaths = [
  "tests",
  "src",
  "docs",
]

[tool.ruff]
line-length = 110
target-version = "py39"
[tool.ruff.lint]
ignore = [
  "UP006", # Allow non standard library generics in type hints
  "UP007", # Allow Union in type hints
  "SIM114", # Allow if with same arms
  "B028", # Allow default warning level
  "SIM117", # Allow nested with
  "UP015", # Allow redundant open parameters
  "UP028", # Allow yield in for loop
]
select = [
  # pycodestyle
  "E",
  "W", # Pyflakes
  "F", # pep8-naming
  "N", # pyupgrade
  "UP", # flake8-bugbear
  "B", # flake8-simplify
  "SIM", # isort
  "I", # docstrings
  "D101",
  "D102",
  "D103",
  "D106",
  "D206",
  "D207",
  "D208",
  "D300",
  "D417",
  "D419", # Numpy v2.0 compatibility
  "NPY201",
]

[tool.coverage.run]
omit = ["src/transcientslightcurves/_version.py"]
